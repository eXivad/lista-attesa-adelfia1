name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/adelfia_waiting_list_ci?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/adelfia_waiting_list_ci?schema=public
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-000000000000
  IDENTIFIER_HMAC_KEY: ci-only-identifier-hmac-key-0000000000
  RATE_LIMIT_HMAC_KEY: ci-only-rate-limit-hmac-key-0000000000
  GMAIL_USER: ""
  GMAIL_OAUTH_CLIENT_ID: ""
  GMAIL_OAUTH_CLIENT_SECRET: ""
  GMAIL_OAUTH_REFRESH_TOKEN: ""
  GMAIL_DAILY_RECIPIENT_LIMIT: "450"
  GMAIL_MAX_RECIPIENTS_PER_MESSAGE: "20"
  MAIL_FROM_NAME: AGESCI Adelfia 1 CI
  MAIL_REPLY_TO: ""
  PRIVACY_POLICY_VERSION: ci-1
  PRIVACY_POLICY_URL: https://example.org/privacy-ci
  BOOTSTRAP_ADMIN_FIRST_NAME: CI
  BOOTSTRAP_ADMIN_LAST_NAME: Admin
  BOOTSTRAP_ADMIN_EMAIL: admin-ci@example.org
  BOOTSTRAP_ADMIN_MEMBER_CODE: CI-ADMIN-001
  BOOTSTRAP_ADMIN_PASSWORD: CI-only-password-000000000000
  E2E_ADMIN_EMAIL: admin-ci@example.org
  E2E_ADMIN_PASSWORD: CI-only-password-000000000000
  E2E_STAFF_EMAIL: staff-ci@example.org
  E2E_STAFF_PASSWORD: CI-only-staff-password-000000000
  E2E_STAFF_MEMBER_CODE: CI-STAFF-001
  E2E_ALLOW_RESET: "true"
  E2E_RESET_SECRET: ci-only-e2e-reset-secret-0000000000

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/setup@ce3b1e5f04cd26dbb4614172464b544b5633cc92 # v2.1.0
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm run prisma:validate

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and integration tests with coverage
        run: pnpm run test:coverage

      - name: Production build
        run: pnpm run build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: adelfia_waiting_list_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adelfia_waiting_list_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/setup@ce3b1e5f04cd26dbb4614172464b544b5633cc92 # v2.1.0
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Apply database migrations
        run: pnpm run db:deploy

      - name: Seed test database
        run: pnpm run db:seed

      - name: Create test administrator
        run: pnpm run admin:bootstrap

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
