version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
