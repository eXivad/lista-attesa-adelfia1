services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: adelfia_waiting_list
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - adelfia-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adelfia_waiting_list"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adelfia-postgres:
